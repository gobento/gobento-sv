<!doctype html>
<html lang="%lang%" dir="%dir%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
		<link rel="manifest" href="/manifest.json" />
		<!-- iOS home-screen app: no browser UI; the status bar stays, drawn over the page's top inset. -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="GoBento" />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/Nunito-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>

		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f5f0" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171421" />

		<script>
			// Chrome fires this once, possibly before the app hydrates; keep it for the install card.
			addEventListener('beforeinstallprompt', (event) => {
				event.preventDefault();
				window.__installPrompt = event;
				dispatchEvent(new Event('installpromptready'));
			});
		</script>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

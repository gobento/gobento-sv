<!doctype html>
<html lang="%lang%" dir="%dir%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="description" content="Rescue surplus food from local businesses and save money." />

		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
		<link rel="manifest" href="/manifest.json" />
		<!-- iOS has no fullscreen display mode; this is the closest: no browser UI, page under the status bar. -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="GoBento" />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/Nunito-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>

		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f5f0" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171421" />

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
